name: TER release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    name: TYPO3 TER release

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: echo "version=$(echo "${{ github.event.ref }}" | cut -d 'v' -f 2)" >> $GITHUB_OUTPUT

      - name: Get comment
        id: get-comment
        run: echo "comment=Released version ${{ steps.get-version.outputs.version }}. Check changelog in documentation on github for more information." >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          extensions: intl, mbstring, json, zip, curl

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "${{ steps.get-comment.outputs.comment }}" ${{ steps.get-version.outputs.version }}
