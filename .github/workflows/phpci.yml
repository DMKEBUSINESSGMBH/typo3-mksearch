name: "PHP-CI"

on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "30 6 * * 1"

env:
    PHP_EXTENSIONS: "intl, mbstring, json, zip, curl"

jobs:

    php-lint:
        name: "PHP Lint"

        runs-on: "ubuntu-latest"

        strategy:
            matrix:
                include:
                    -   typo3-version: "^11.5"
                        php-version: "7.4"
                    -   typo3-version: "^11.5"
                        php-version: "8.0"
                    -   typo3-version: "^12.4"
                        php-version: "8.1"
                    -   typo3-version: "^12.4"
                        php-version: "8.2"
                    -   typo3-version: "^12.4"
                        php-version: "8.3"

        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v4"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
            -
                name: "Validate composer.json and composer.lock"
                run: "composer validate"
            -
                name: "Determine composer cache directory"
                id: "determine-composer-cache-directory"
                run: "echo \"::set-output name=directory::$(composer config cache-dir)\""
            -
                name: "Cache dependencies installed with composer"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
                    key: "php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}"
                    restore-keys: "php-${{ matrix.php-version }}-composer-"
            -
                name: "Install composer dependencies"
                run: |
                    composer remove --no-update typo3/cms typo3/cms-core
                    composer require typo3/minimal:"${{ matrix.typo3-version }}"
            -
                name: "Run Linter"
                run: "composer lint:php"
            -
                name: "Run Linter"
                run: "composer lint:php"

    php-qs:
        name: "PHP QS"

        runs-on: "ubuntu-latest"

        needs: "php-lint"

        strategy:
            matrix:
                include:
                    -   typo3-version: "^11.5"
                        php-version: "7.4"
                    -   typo3-version: "^11.5"
                        php-version: "8.0"
                    -   typo3-version: "^12.4"
                        php-version: "8.1"
                    -   typo3-version: "^12.4"
                        php-version: "8.2"
                    -   typo3-version: "^12.4"
                        php-version: "8.3"

        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v4"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
            -
                name: "Validate composer.json and composer.lock"
                run: "composer validate"
            -
                name: "Determine composer cache directory"
                id: "determine-composer-cache-directory"
                run: "echo \"::set-output name=directory::$(composer config cache-dir)\""
            -
                name: "Cache dependencies installed with composer"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
                    key: "php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}"
                    restore-keys: "php-${{ matrix.php-version }}-composer-"
            -
                name: "Install composer dependencies"
                run: |
                    composer remove --no-update typo3/cms typo3/cms-core
                    composer require typo3/minimal:"${{ matrix.typo3-version }}"
            -
                name: "Run phpcs"
                run: "composer test:phpcs"
            -
                name: "Run phpcompatibility"
                run: "composer test:phpcompatibility"

    php-stan:
        name: "PHPStan"

        runs-on: "ubuntu-latest"

        needs: "php-lint"

        strategy:
            matrix:
                include:
                    -   typo3-version: "^11.5"
                        php-version: "7.4"
                    -   typo3-version: "^11.5"
                        php-version: "8.0"
                    -   typo3-version: "^11.5"
                        php-version: "8.1"
                    -   typo3-version: "^11.5"
                        php-version: "8.2"
                    -   typo3-version: "^11.5"
                        php-version: "8.3"
                    -   typo3-version: "^12.4"
                        php-version: "8.1"
                    -   typo3-version: "^12.4"
                        php-version: "8.2"
                    -   typo3-version: "^12.4"
                        php-version: "8.3"

        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v4"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
            -
                name: "Validate composer.json and composer.lock"
                run: "composer validate"
            -
                name: "Determine composer cache directory"
                id: "determine-composer-cache-directory"
                run: "echo \"::set-output name=directory::$(composer config cache-dir)\""
            -
                name: "Cache dependencies installed with composer"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
                    key: "php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}"
                    restore-keys: "php-${{ matrix.php-version }}-composer-"
            -
                name: "Install composer dependencies"
                run: |
                    composer remove --no-update typo3/cms typo3/cms-core
                    composer require typo3/minimal:"${{ matrix.typo3-version }}"
            -
                name: "Run phpstan"
                run: "composer test:phpstan"


    php-unit:
        name: "PHP Unit"

        runs-on: "ubuntu-latest"

        needs: ["php-lint", "php-qs"]

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   typo3-version: "^11.5"
                        php-version: "7.4"
                    -   typo3-version: "^11.5"
                        php-version: "8.0"
                    -   typo3-version: "^11.5"
                        php-version: "8.1"
                    -   typo3-version: "^11.5"
                        php-version: "8.2"
                    -   typo3-version: "^11.5"
                        php-version: "8.3"
                    -   typo3-version: "^12.4"
                        php-version: "8.1"
                    -   typo3-version: "^12.4"
                        php-version: "8.2"
                    -   typo3-version: "^12.4"
                        php-version: "8.3"

        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v4"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
            -
                name: "Validate composer.json and composer.lock"
                run: "composer validate"
            -
                name: "Determine composer cache directory"
                id: "determine-composer-cache-directory"
                run: "echo \"::set-output name=directory::$(composer config cache-dir)\""
            -
                name: "Cache dependencies installed with composer"
                uses: "actions/cache@v4"
                with:
                    path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
                    key: "php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}"
                    restore-keys: "php-${{ matrix.php-version }}-composer-"
            -
                name: "Install composer dependencies"
                run: |
                    composer remove --no-update typo3/cms typo3/cms-core
                    composer require typo3/minimal:"${{ matrix.typo3-version }}"
            -
                name: "Run PHP unit tests"
                run: "composer test:phpunit"
